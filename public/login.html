<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Přístup k souhrnu</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root {
  color-scheme: dark;
  --bg: #071226; --card: rgba(16, 26, 46, .82); --ink: #eef2fa; --ink-2: #a9b7d0;
  --line: rgba(255,255,255,.14); --accent: #5b9bf0; --err: #ff8f70;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(91,155,240,.35), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(240,122,72,.18), transparent 60%),
    var(--bg);
}
.card {
  width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
  border-radius: 18px; padding: 36px 32px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #9cc2ff; margin-bottom: 10px; }
h1 { font: 700 30px/1.15 "Iowan Old Style", Charter, Georgia, serif; margin: 0 0 10px; letter-spacing: -.01em; }
p { color: var(--ink-2); margin: 0 0 24px; }
label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
input {
  width: 100%; font-family: inherit; font-size: 17px; font-weight: 500; padding: 14px 16px; border-radius: 11px; border: 1px solid var(--line);
  background: rgba(255,255,255,.06); color: var(--ink); outline: none;
}
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,155,240,.3); }
button {
  width: 100%; margin-top: 16px; font-family: inherit; font-size: 16px; font-weight: 600; padding: 14px 16px; border-radius: 11px; border: 0;
  background: #fff; color: #0b1a33; cursor: pointer;
}
button:hover { background: #e8f0ff; }
.msg { margin: 14px 0 0; font-size: 14.5px; min-height: 1.4em; }
.msg.err { color: var(--err); }
.msg.ok { color: #7fd6a8; }
.foot { margin-top: 26px; font-size: 13px; color: var(--ink-2); }
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">European <span style="white-space:nowrap">E-commerce</span> Report&nbsp;2026</div>
  <h1>Český souhrn pro produktový a&nbsp;projektový tým</h1>
  <p>Interní materiál. Pro vstup zadejte přístupový kód.</p>
  <form method="post" action="/api/login" autocomplete="off">
    <label for="code">Přístupový kód</label>
    <input id="code" name="code" type="password" required autofocus autocomplete="current-password">
    <input type="hidden" name="next" id="next" value="/">
    <button type="submit">Vstoupit</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
  <div class="foot">Kód vám předá vedoucí produktového nebo projektového oddělení.</div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const next = q.get('next');
  if (next && next.startsWith('/') && !next.startsWith('//')) document.getElementById('next').value = next;
  const msg = document.getElementById('msg');
  if (q.get('error') === '1') { msg.textContent = 'Nesprávný kód. Zkuste to prosím znovu.'; msg.className = 'msg err'; }
  if (q.get('error') === 'config') { msg.textContent = 'Přístup zatím není nastaven (chybí ACCESS_CODE na serveru).'; msg.className = 'msg err'; }
  if (q.get('logout') === '1') { msg.textContent = 'Byli jste odhlášeni.'; msg.className = 'msg ok'; }
</script>
</body>
</html>
